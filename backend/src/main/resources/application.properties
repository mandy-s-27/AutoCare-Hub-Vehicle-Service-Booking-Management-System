# ==============================
# Server
# ==============================
server.port=8080
server.servlet.context-path=/

# ==============================
# PostgreSQL Datasource
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/vehicle_service_db
spring.datasource.username=postgres
spring.datasource.password=2710
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 🔥 IMPORTANT FIX
spring.jackson.serialization.fail-on-empty-beans=false

# ==============================
# JWT
# ==============================
jwt.secret=ChangeThisSuperSecretKeyForVehicleServiceApp2026MustBeLongEnough
jwt.expiration.ms=86400000

# ==============================
# File Upload (repair images)
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.com.vehicleservice=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================
# Swagger
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
