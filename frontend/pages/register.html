<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register · Vehicle Service Booking System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo">🚗 Mandy Bikserv</div>
    <p>Create your customer account</p>

    <div id="msgBox"></div>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required placeholder="John Doe">

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" placeholder="9876543210">

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Create Account</button>
    </form>

    <p style="text-align:center;margin-top:var(--space-md);font-size:14px;">
      Already have an account? <a href="../index.html">Sign in</a>
    </p>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msgBox = document.getElementById("msgBox");
    msgBox.innerHTML = "";

    const payload = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      password: document.getElementById("password").value
    };

    try {
      const res = await apiCall("/auth/register", "POST", payload, false);
      Auth.setSession(res);
      window.location.href = "customer-dashboard.html";
    } catch (err) {
      showMessage(msgBox, err.message || "Registration failed.");
    }
  });
</script>
</body>
</html>
